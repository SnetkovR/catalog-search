services:
  catalog-search:
    build: .
    image: catalog-search:local
    ports:
      - "${CATALOG_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./data/catalog
        target: /app/data/catalog
        read_only: true
      - catalog-index:/app/var
      - model-cache:/app/.cache/huggingface
    environment:
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  catalog-index:
  model-cache:
