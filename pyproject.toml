[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-search"
version = "0.1.0"
description = "Local CPU image similarity search"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "filelock>=3.17,<4",
]

[project.scripts]
catalog-search = "catalog_search.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
